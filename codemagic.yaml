workflows:
  android-apk-build:
    name: Build brayanTech APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    scripts:
      - name: Build Android APK
        script: |
          chmod +x gradlew
          ./gradlew assembleRelease
    artifacts:
      - app/build/outputs/apk/**/*.apk
